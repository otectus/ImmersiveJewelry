org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=immersive_jewelry
mod_name=Immersive Jewelry
mod_version=1.2.2
mod_group=com.otectus.immersivejewelry
mod_archive=immersive-jewelry
mod_license=GPL-3.0
mod_authors=Otectus

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
jei_version=15.20.0.135
# Curios is optional: compileOnly API, runtimeOnly in dev unless -PnoCurios
curios_version=5.14.1+1.20.1
curios_version_range=[5.4,)
# Jade 11.13 for 1.20.1 (CurseForge file id), compileOnly
jade_curse_file=6271651
# Immersive Smithing is optional: libs/immersive-smithing-<version>.jar, runtimeOnly in dev unless -PnoSmithing
immersive_smithing_version=1.0.0
immersive_smithing_version_range=[1.0,)
# Diegesis is required on both sides: in-world station scenes, the focus camera and scene picking (behind client/workstation).
# Tested binary: CurseForge file 9624632, "Diegesis 1.0.0-beta.10+1.20.1 (Forge)" (source tag v1.0.0-beta.10, commit 727c177).
# The scenes use beta.10 fields (takes_items, carry_size) that beta.9's strict scene parser rejects. The API may change before
# 1.0.0, so the accepted range is the tested release only; widen it after testing a newer one.
diegesis_version=1.0.0-beta.10
diegesis_curse_file=9624632
diegesis_version_range=[1.0.0-beta.10,1.0.0-beta.11)

# Library integrations (1.2.2). Coordinates from each project's official Maven; the mods.toml ranges are the tested
# releases (the same ones Immersive Smithing 1.3.x pins, so one pack resolves one copy; widen only after testing a newer
# one). Patchouli (the Jeweler's Handbook) and GeckoLib 4 (the stations' and tools' rigs; the block entities and pliers are
# its animatables) are required on clients and servers. Ponder (the demonstrations), the Flywheel it needs, and
# playerAnimator (the jeweler's body poses) are required on clients only: a dedicated server runs without them.
patchouli_version=1.20.1-85-FORGE
patchouli_version_range=[1.20.1-85-FORGE,1.20.1-86)
ponder_version=1.0.91
ponder_version_range=[1.0.91,1.1)
flywheel_version=1.0.5
flywheel_version_range=[1.0.5,2.0)
# GeckoLib bundles mclib 20 as jar-in-jar; nothing else is needed at runtime.
geckolib_version=4.8.4
geckolib_version_range=[4.8.4,4.9)
# The mclib version GeckoLib 4.8.4 bundles (jar-in-jar); compile-only (the clip sampler reads keyframe values).
geckolib_mclib_version=20
playeranimator_version=1.0.2-rc1+1.20
playeranimator_version_range=[1.0.2-rc1,1.0.3)
