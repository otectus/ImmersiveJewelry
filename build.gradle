buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
// No mixins of our own. The plugin is applied for the SRG->MCP map that the optional mods' mixins need in dev runs.
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group
base { archivesName = mod_archive }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // Reference players for the minigames, shared by the unit tests and the GameTests. Never shipped.
    test { java { srcDir 'src/testShared/java' } }
    gameTest {
        java { srcDir 'src/testShared/java' }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (immersive_jewelry_smoketest): drives a dev client into a fresh flat world, stages every
    // station and screen, saves screenshots and smoketest-result.json, then quits. Used by runClient -PsmokeTest. Never shipped.
    smokeTest {
        java { srcDir 'src/testShared/java' }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { immersive_jewelry { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest')) {
                property 'immersive_jewelry.smoketest.output', file('run/smoketest').absolutePath
                property 'immersive_jewelry.logRefusals', 'true'
                mods { immersive_jewelry_smoketest { source sourceSets.smokeTest } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            // Refused discrete commands are logged (rate-limited) in test runs; production logs them at debug only.
            property 'immersive_jewelry.logRefusals', 'true'
            // Against another Diegesis than the tested one: the tests that pin the tested release's exact behaviour relax.
            if (project.hasProperty('diegesisRuntimeJar')) property 'immersive_jewelry.compatRun', 'true'
            mods { immersive_jewelry { source sourceSets.gameTest } }
        }
    }
}

// A Diegesis to run against instead of the tested one (see dependencies). Copied under a name that carries its content hash,
// so the remapped copy ForgeGradle caches can never be a previous jar's.
if (project.hasProperty('diegesisRuntimeJar')) {
    def source = file(project.diegesisRuntimeJar)
    def hash = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString().substring(0, 12)
    ext.diegesisRuntimeVersion = "compat-${hash}"
    def dir = layout.buildDirectory.dir('diegesis-runtime').get().asFile
    dir.mkdirs()
    java.nio.file.Files.copy(source.toPath(), new File(dir, "diegesis-runtime-${diegesisRuntimeVersion}.jar").toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    configurations.matching { it.name == 'runtimeClasspath' }.configureEach {
        exclude group: 'curse.maven', module: 'diegesis-1790227'
    }
}

repositories {
    flatDir { dirs 'libs' }
    if (project.hasProperty('diegesisRuntimeJar')) flatDir { dirs layout.buildDirectory.dir('diegesis-runtime').get().asFile }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei'; includeGroup 'vazkii.patchouli' }
    }
    maven {
        url = 'https://maven.createmod.net/'
        content { includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' }
    }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib'; includeGroup 'com.eliotlash.mclib' }
    }
    maven {
        url = 'https://maven.kosmx.dev/'
        content { includeGroup 'dev.kosmx.player-anim' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Equipment slots (integration/curios, reached only after a ModList check). Without it the built-in slots are used.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if (!project.hasProperty('noCurios')) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }

    // Jewelry blanks are smithed (integration/smithing, reached only after a ModList check).
    compileOnly fg.deobf("local:immersive-smithing:${immersive_smithing_version}")
    if (!project.hasProperty('noSmithing')) {
        runtimeOnly fg.deobf("local:immersive-smithing:${immersive_smithing_version}")
    }

    // In-world workstation scenes, focus camera and picking (client/workstation adapter). Required on both sides.
    // -PdiegesisRuntimeJar=<path to a Diegesis Forge jar> compiles against the tested release but runs (GameTests, client)
    // against the given one, to see how the compatibility layer (integration/diegesis/DiegesisCompat) copes with an API it was
    // not built for; pass -Pdiegesis_version_range=... too when that release is outside the declared range. Dev runs only.
    implementation fg.deobf("curse.maven:diegesis-1790227:${diegesis_curse_file}")
    if (project.hasProperty('diegesisRuntimeJar')) {
        runtimeOnly fg.deobf("local:diegesis-runtime:${diegesisRuntimeVersion}")
    }

    // Library integrations (1.2.2, gradle.properties). Patchouli: the documented compile-against-API arrangement.
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}:api")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
    // Ponder's POM names an older Flywheel build as a runtime dependency; the tested Flywheel is pinned instead.
    // Ponder, Flywheel and playerAnimator are optional client libraries (since 1.3.0): compiled against, in the dev runtime unless
    // -PnoPonder (Ponder and Flywheel) or -PnoPlayerAnimator, which test the game without them.
    compileOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) { transitive = false }
    if (!project.hasProperty('noPonder')) {
        runtimeOnly(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) { transitive = false }
        runtimeOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    }
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // GeckoLib's keyframe values are mclib IValues; GeckoLib ships mclib inside its jar, so it is compile-only here.
    compileOnly "com.eliotlash.mclib:mclib:${geckolib_mclib_version}"
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}")
    if (!project.hasProperty('noPlayerAnimator')) {
        runtimeOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}")
    }

    // Station overlays (integration/jade). Jade discovers the plugin by annotation; nothing references it otherwise.
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    // In a dev environment Jade refuses to start while any plugin's config keys lack translations, and Immersive
    // Smithing 1.0.0 ships without its own; the smoke-test agent supplies them, so Jade joins only that run.
    if (project.hasProperty('smokeTest')) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                      mod_authors: mod_authors, minecraft_version_range: minecraft_version_range,
                      forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                      curios_version_range: curios_version_range,
                      immersive_smithing_version_range: immersive_smithing_version_range,
                      diegesis_version_range: diegesis_version_range, patchouli_version_range: patchouli_version_range,
                      geckolib_version_range: geckolib_version_range, ponder_version_range: ponder_version_range,
                      flywheel_version_range: flywheel_version_range, playeranimator_version_range: playeranimator_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('processSmokeTestResources', ProcessResources).configure {
    inputs.properties mod_version: mod_version, mod_license: mod_license
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version, mod_license: mod_license }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
                        'Specification-Version': '1', 'Implementation-Title': project.name,
                        'Implementation-Version': mod_version, 'Implementation-Vendor': mod_authors)
    finalizedBy 'reobfJar'
}
