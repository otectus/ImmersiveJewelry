buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
// No mixins of our own. The plugin is applied for the SRG->MCP map that the optional mods' mixins need in dev runs.
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group
base { archivesName = mod_archive }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    // Reference players for the minigames, shared by the unit tests and the GameTests. Never shipped.
    test { java { srcDir 'src/testShared/java' } }
    gameTest {
        java { srcDir 'src/testShared/java' }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (immersive_jewelry_smoketest): drives a dev client into a fresh flat world, stages every
    // station and screen, saves screenshots and smoketest-result.json, then quits. Used by runClient -PsmokeTest. Never shipped.
    smokeTest {
        java { srcDir 'src/testShared/java' }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { immersive_jewelry { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest')) {
                property 'immersive_jewelry.smoketest.output', file('run/smoketest').absolutePath
                mods { immersive_jewelry_smoketest { source sourceSets.smokeTest } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            mods { immersive_jewelry { source sourceSets.gameTest } }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // Equipment slots (integration/curios, reached only after a ModList check). Without it the built-in slots are used.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if (!project.hasProperty('noCurios')) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }

    // Jewelry blanks are smithed (integration/smithing, reached only after a ModList check).
    compileOnly fg.deobf("local:immersive-smithing:${immersive_smithing_version}")
    if (!project.hasProperty('noSmithing')) {
        runtimeOnly fg.deobf("local:immersive-smithing:${immersive_smithing_version}")
    }

    // Station overlays (integration/jade). Jade discovers the plugin by annotation; nothing references it otherwise.
    compileOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    // In a dev environment Jade refuses to start while any plugin's config keys lack translations, and Immersive
    // Smithing 1.0.0 ships without its own; the smoke-test agent supplies them, so Jade joins only that run.
    if (project.hasProperty('smokeTest')) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_curse_file}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                      mod_authors: mod_authors, minecraft_version_range: minecraft_version_range,
                      forge_version_range: forge_version_range, loader_version_range: loader_version_range,
                      curios_version_range: curios_version_range,
                      immersive_smithing_version_range: immersive_smithing_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('processSmokeTestResources', ProcessResources).configure {
    inputs.properties mod_version: mod_version, mod_license: mod_license
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version, mod_license: mod_license }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
                        'Specification-Version': '1', 'Implementation-Title': project.name,
                        'Implementation-Version': mod_version, 'Implementation-Vendor': mod_authors)
    finalizedBy 'reobfJar'
}
